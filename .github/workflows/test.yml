name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run decision unit tests
        shell: pwsh
        run: cscript.exe //nologo tests/RyddeDecisions.Tests.vbs

      - name: Run publication and syntax tests
        shell: pwsh
        run: ./tests/Test-Publication.ps1
